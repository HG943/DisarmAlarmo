
blueprint:
  name: Alarmo - Calendar access
  description: >-
    Disarms Alarmo before calendar events whose title or description
    contains "Alarmo Off". Recovers missed disarm actions after
    Home Assistant restarts. Mobile and persistent notifications
    can be enabled independently. Never arms automatically.
  domain: automation

  input:
    calendar_entity:
      name: Google Calendar
      description: Calendar containing the relevant events.
      selector:
        entity:
          filter:
            - domain: calendar

    alarm_entity:
      name: Alarm panel
      description: Alarmo alarm control panel to disarm.
      selector:
        entity:
          filter:
            - domain: alarm_control_panel

    notification_service:
      name: Mobile notification service
      description: >-
        Example: notify.mobile_app_your_phone
      selector:
        text:

    marker:
      name: Event marker
      description: Text that must appear in the event title or description.
      default: Alarmo Off
      selector:
        text:

    disarm_offset:
      name: Disarm before event
      description: Negative offset, e.g. -00:30:00 for 30 minutes.
      default: "-00:30:00"
      selector:
        text:

    enable_mobile_notifications:
      name: Enable mobile notifications
      description: Send mobile notifications at event start and end.
      default: true
      selector:
        boolean:

    enable_persistent_disarm:
      name: Persistent notification when disarmed
      description: Create a Home Assistant notification when Alarmo is disarmed.
      default: true
      selector:
        boolean:

    enable_persistent_event_end:
      name: Persistent notification when event ends
      description: Create a Home Assistant reminder when the event ends.
      default: true
      selector:
        boolean:

variables:
  calendar_entity: !input calendar_entity
  marker: !input marker
  disarm_offset: !input disarm_offset
  enable_mobile_notifications: !input enable_mobile_notifications
  enable_persistent_disarm: !input enable_persistent_disarm
  enable_persistent_event_end: !input enable_persistent_event_end
  notification_service: !input notification_service

triggers:
  - trigger: homeassistant
    event: start
    id: startup_recovery

  - trigger: calendar
    entity_id: !input calendar_entity
    event: start
    offset: !input disarm_offset
    id: access_start

  - trigger: calendar
    entity_id: !input calendar_entity
    event: end
    id: access_end

conditions:
  - condition: template
    value_template: >-
      {% if trigger.id == 'startup_recovery' %}
        true
      {% else %}
        {% set summary = trigger.calendar_event.summary | default('', true) %}
        {% set description = trigger.calendar_event.description | default('', true) %}
        {{ (marker | lower) in ((summary ~ ' ' ~ description) | lower) }}
      {% endif %}

actions:
  - choose:
      # Startup recovery: find events whose disarm time has passed
      # but which have not yet ended.
      - conditions:
          - condition: trigger
            id: startup_recovery
        sequence:
          - action: calendar.get_events
            target:
              entity_id: !input calendar_entity
            data:
              start_date_time: "{{ (now() - timedelta(days=2)).isoformat() }}"
              end_date_time: "{{ (now() + timedelta(days=2)).isoformat() }}"
            response_variable: calendar_response

          - repeat:
              for_each: >-
                {{ calendar_response[calendar_entity]['events']
                   | default([], true) }}
              sequence:
                - if:
                    - condition: template
                      value_template: >-
                        {% set summary = repeat.item.summary | default('', true) %}
                        {% set description = repeat.item.description | default('', true) %}
                        {% set matches =
                          (marker | lower) in
                          ((summary ~ ' ' ~ description) | lower) %}
                        {% set start_ts = as_timestamp(repeat.item.start, 0) %}
                        {% set end_ts = as_timestamp(repeat.item.end, 0) %}
                        {% set due_ts =
                          as_timestamp(now() - as_timedelta(disarm_offset)) %}
                        {{
                          matches
                          and end_ts > as_timestamp(now())
                          and start_ts <= due_ts
                        }}
                  then:
                    - action: alarm_control_panel.alarm_disarm
                      target:
                        entity_id: !input alarm_entity

                    - if:
                        - condition: template
                          value_template: "{{ enable_mobile_notifications }}"
                      then:
                        - action: "{{ notification_service }}"
                          data:
                            title: "Alarmo disarmed - startup recovery"
                            message: >-
                              Home Assistant has restarted and recovered a
                              missed scheduled disarm. Alarmo was disarmed
                              for "{{ repeat.item.summary }}".
                              Event start: {{ repeat.item.start }}.
                              Remember that the alarm is now off.

                    - if:
                        - condition: template
                          value_template: "{{ enable_persistent_disarm }}"
                      then:
                        - action: persistent_notification.create
                          data:
                            notification_id: alarmo_calendar_start
                            title: "Alarmo disarmed - startup recovery"
                            message: >-
                              Home Assistant has restarted and recovered a
                              missed scheduled disarm. Alarmo was disarmed
                              for "{{ repeat.item.summary }}".
                              Event start: {{ repeat.item.start }}.
                              Remember that the alarm is now off.

      # Normal scheduled disarm before an event.
      - conditions:
          - condition: trigger
            id: access_start
        sequence:
          - action: alarm_control_panel.alarm_disarm
            target:
              entity_id: !input alarm_entity

          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications }}"
            then:
              - action: "{{ notification_service }}"
                data:
                  title: "Alarmo disarmed"
                  message: >-
                    Alarmo was disarmed for
                    "{{ trigger.calendar_event.summary }}".
                    The event starts at {{ trigger.calendar_event.start }}.
                    Remember that the alarm is now off.

          - if:
              - condition: template
                value_template: "{{ enable_persistent_disarm }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: alarmo_calendar_start
                  title: "Alarmo disarmed"
                  message: >-
                    Alarmo was disarmed for
                    "{{ trigger.calendar_event.summary }}".
                    The event starts at {{ trigger.calendar_event.start }}.
                    Remember that the alarm is now off.

      # Event end: reminders only; never arm automatically.
      - conditions:
          - condition: trigger
            id: access_end
        sequence:
          - if:
              - condition: template
                value_template: "{{ enable_mobile_notifications }}"
            then:
              - action: "{{ notification_service }}"
                data:
                  title: "Alarm reminder"
                  message: >-
                    "{{ trigger.calendar_event.summary }}" has ended.
                    Remember to arm Alarmo if you're away.

          - if:
              - condition: template
                value_template: "{{ enable_persistent_event_end }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: alarmo_calendar_end
                  title: "Alarm reminder"
                  message: >-
                    "{{ trigger.calendar_event.summary }}" has ended.
                    Remember to arm Alarmo if you're away.

mode: queued
max: 10
